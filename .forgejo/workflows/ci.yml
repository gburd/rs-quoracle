# Forgejo Actions on Codeberg's hosted runners (codeberg-* labels).
# Jobs are split to fit the runners' time limits. The official rust images
# have no node, so checkout is a plain git clone instead of a JS action.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1-trixie
    steps:
      - name: Checkout
        run: |
          git clone -q --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"
      - run: apt-get update -qq && apt-get install -y -qq coinor-libcbc-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        image: ["rust:1-trixie", "rust:1.88-trixie"]
        solver: [microlp, cbc]
    container:
      image: docker.io/library/${{ matrix.image }}
    steps:
      - name: Checkout
        run: |
          git clone -q --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"
      - if: matrix.solver == 'cbc'
        run: apt-get update -qq && apt-get install -y -qq coinor-libcbc-dev
      - run: cargo test --no-default-features --features ${{ matrix.solver }} --lib --tests

  coverage:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1-trixie
    steps:
      - name: Checkout
        run: |
          git clone -q --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"
      - run: apt-get update -qq && apt-get install -y -qq coinor-libcbc-dev python3
      - run: rustup toolchain install nightly --profile minimal -c llvm-tools-preview
      - run: |
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C /usr/local/cargo/bin
      - run: ./scripts/coverage.sh

  pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, coverage]
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1-trixie
    steps:
      - name: Checkout
        run: |
          git clone -q --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"
      - run: rustup toolchain install nightly --profile minimal
      - run: |
          curl -LsSf https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C /usr/local/cargo/bin
      - run: ./scripts/build-site.sh
      - name: Publish to the pages branch (Codeberg Pages)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "PAGES_TOKEN not set; skipping"; exit 0; fi
          cd target/site
          git init -q -b pages
          git config user.name "forgejo-actions"
          git config user.email "noreply@codeberg.org"
          git add -A && git commit -qm "Deploy docs for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" pages
